<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Favourite Games</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar with logo and dropdown -->
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="images/logo.png" alt="Logo" width="40">
      </a>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Games</a>
          <ul class="dropdown-menu">
            <li><button class="dropdown-item" type="button" data-bs-target="#gameCarousel" data-bs-slide-to="0">Game One</button></li>
            <li><button class="dropdown-item" type="button" data-bs-target="#gameCarousel" data-bs-slide-to="1">Game Two</button></li>
            <li><button class="dropdown-item" type="button" data-bs-target="#gameCarousel" data-bs-slide-to="2">Game Three</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container mt-4">

    <h1 class="text-center">My Favourite Games</h1>

    <!-- Carousel with captions -->
    <div id="gameCarousel" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/game1.jpg" class="d-block w-100" alt="Game One">
          <div class="carousel-caption">
            <h3>Game One</h3>
            <p>Why I love this game.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="images/game2.jpg" class="d-block w-100" alt="Game Two">
          <div class="carousel-caption">
            <h3>Game Two</h3>
            <p>Why I love this game.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="images/game3.jpg" class="d-block w-100" alt="Game Three">
          <div class="carousel-caption">
            <h3>Game Three</h3>
            <p>Why I love this game.</p>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#gameCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#gameCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3 mt-4">
    <p>My Website 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
